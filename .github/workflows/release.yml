name: Release

# Publishing is: git tag v1.0.0 && git push origin v1.0.0
#
# Tag on main, never on a branch. A tag is a claim that this commit is the
# mainline state; tagging before merging leaves the released commit unreachable
# from the default branch, and orphans the tag entirely if the branch is later
# rebased or squashed.
#
# The artifact is ad-hoc signed, not Developer ID signed and not notarized.
# That is a deliberate deferral, not an oversight -- notarization needs the
# $99/year Apple Developer Program. See aingineering/AING-0001 §4. The
# consequence is that a downloaded build carries the quarantine flag and macOS
# may refuse it until that flag is cleared, so the generated release notes
# carry the install instructions rather than assuming a double-click works.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                  Resources/Info.plist)

          # A tag that disagrees with the bundle is a packaging bug worth
          # failing on: the version someone reads in the release would not be
          # the version recorded inside the thing they downloaded.
          if [ "$VERSION" != "$PLIST" ]; then
            echo "::error::tag $TAG implies version $VERSION, but Info.plist says $PLIST"
            exit 1
          fi

          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION from $TAG"

      - name: Build, test, and verify
        # build.sh runs the engine suite and LoadTest, so a release cannot be
        # cut from a tree that fails either.
        run: ./build.sh

      - name: Package
        id: package
        run: |
          set -euo pipefail
          ARCHIVE="Starfield-${{ steps.version.outputs.version }}.zip"

          # Stage an unversioned folder. The version belongs in the archive
          # filename, not in a path users are told to cd into -- a versioned
          # folder goes stale in every instruction the moment the next release
          # ships.
          STAGE=Starfield
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto build/Starfield.saver "$STAGE/Starfield.saver"

          # The uninstaller also ships inside the bundle, so it survives the
          # download being deleted. This copy is for people who still have it.
          cp uninstall.sh "$STAGE/uninstall.sh"
          cp "packaging/Uninstall Starfield.command" "$STAGE/Uninstall Starfield.command"
          chmod 755 "$STAGE/uninstall.sh" "$STAGE/Uninstall Starfield.command"

          # ditto, not zip. A .saver is a bundle -- a directory -- and ditto is
          # the tool that preserves the extended attributes and layout the code
          # signature is computed over. Verified: the signature survives this
          # round-trip and codesign --verify --deep --strict still passes.
          ditto -c -k --keepParent "$STAGE" "$ARCHIVE"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Verify what a user will actually download
        # Unpack the archive and check the result, rather than trusting the
        # bundle that was never packed. This is the step that would catch a
        # packaging tool quietly breaking the signature.
        run: |
          set -euo pipefail
          mkdir -p roundtrip
          ditto -x -k "${{ steps.package.outputs.archive }}" roundtrip
          codesign --verify --deep --strict --verbose=2 roundtrip/Starfield/Starfield.saver
          ./build/LoadTest roundtrip/Starfield/Starfield.saver

          # The .command wrapper invokes ./uninstall.sh, so the executable bit
          # has to survive git, ditto -c -k and ditto -x -k. If it does not, the
          # only no-terminal uninstall route is broken for everyone.
          for f in "roundtrip/Starfield/uninstall.sh" "roundtrip/Starfield/Uninstall Starfield.command"; do
            [ -x "$f" ] || { echo "::error::$f lost its executable bit in the archive"; exit 1; }
          done

          # The thumbnails must survive packing too: they are what the Screen
          # Saver pane shows, and a missing one fails silently.
          for f in thumbnail.png thumbnail@2x.png uninstall.sh; do
            [ -e "roundtrip/Starfield/Starfield.saver/Contents/Resources/$f" ] \
              || { echo "::error::Resources/$f missing from the packaged bundle"; exit 1; }
          done

      - name: Write the release notes
        run: |
          cat > NOTES.md <<'NOTES'
          A macOS port of the Windows 2000 "Starfield Simulation" screen saver.

          ## Install

          Download `Starfield-VERSION.zip` below and unzip it. You get a
          `Starfield` folder holding the saver and an uninstaller. Then
          **either**:

          **Double-click `Starfield/Starfield.saver`.** macOS offers to install
          it and opens System Settings at the Screen Saver pane.

          **Or install it by hand:**

          ```sh
          cd Starfield
          xattr -dr com.apple.quarantine Starfield.saver
          cp -R Starfield.saver ~/Library/"Screen Savers"/
          ```

          ### Upgrading from an earlier version

          System Settings caches the Screen Saver pane's preview tiles, and
          nothing about replacing the saver invalidates that cache — not new
          contents, not a new version number. If the pane still shows the old
          thumbnail after upgrading, run:

          ```sh
          ~/Library/"Screen Savers"/Starfield.saver/Contents/Resources/uninstall.sh --refresh-preview
          ```

          A fresh install on a machine that never had Starfield is unaffected.

          ## Uninstall

          Double-click `Starfield/Uninstall Starfield.command`, or run the
          uninstaller that ships inside the installed bundle:

          ```sh
          ~/Library/"Screen Savers"/Starfield.saver/Contents/Resources/uninstall.sh
          ```

          It takes `--dry-run` to show what it would remove, and
          `--keep-settings` to keep your density and warp speed. If you no
          longer have either copy, the README lists the files to remove by
          hand.

          ### If macOS refuses to open it

          This build is ad-hoc signed rather than notarized, because
          notarization requires a paid Apple Developer account. Anything
          downloaded from the internet is quarantined, and macOS is strict
          about quarantined code that it cannot trace to a registered
          developer.

          Clearing the quarantine flag is the reliable fix:

          ```sh
          xattr -dr com.apple.quarantine /path/to/Starfield.saver
          ```

          Alternatively, open **System Settings → Privacy & Security**, scroll
          to Security, and use **Open Anyway** after the first blocked attempt.

          If you would rather trust nothing you did not build, the repository
          builds from source with Apple's Command Line Tools and no
          dependencies — `./build.sh` — and a locally built bundle is never
          quarantined in the first place.

          ## Requirements

          macOS 13 or later, Apple Silicon. Intel is not supported: a screen
          saver is a plugin loaded into the system's host process, so Rosetta
          cannot bridge the architecture gap.

          ## Verify the download

          ```
          SHA256  CHECKSUM
          ```
          NOTES
          sed -i '' "s/VERSION/${{ steps.version.outputs.version }}/g" NOTES.md
          sed -i '' "s/CHECKSUM/${{ steps.package.outputs.sha }}/" NOTES.md
          cat NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            --title "Starfield ${{ steps.version.outputs.version }}" \
            --notes-file NOTES.md \
            --verify-tag
